name: Docs can build

on:
  push:
    # dev-v2 is where next prerelease tags are cut. A merge does not re-fire
    # pull_request, so push must re-run the docs build the same way main does.
    branches: [main, dev-v2]
  # No `branches` filter: a PR whose base is a feature branch (a stacked PR, or
  # anything targeting dev-v2) would otherwise get no check from this workflow
  # at all. An absent check reads as a passing one. See #200.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run docs
