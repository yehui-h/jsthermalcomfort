name: Docs can build

on:
  push:
    branches: [main, typescript]
  pull_request:
    branches: [main, typescript]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run docs
