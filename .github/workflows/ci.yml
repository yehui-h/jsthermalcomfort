name: CI

on:
  push:
    # dev-v2 is where next prerelease tags are cut. A merge does not re-fire
    # pull_request, so push must re-run tests, format, build, and check:types.
    branches: [main, dev-v2]
  # No `branches` filter: a stacked PR (one whose base is another feature
  # branch) would otherwise get no checks at all, which reads as passing
  # rather than as skipped. See #200.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run check:format
      - run: npm run build
      - run: npm run check:types
