name: CI

on:
  push:
    branches: [main, typescript]
  pull_request:
    branches: [main, typescript]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run check:format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Proves the ESM/types wiring still resolves for node16 ESM and bundler
      # consumers. `publint` is the half that checks `main`/`types` actually
      # point at files that exist — `attw --profile esm-only` skips the node10
      # and node16-CJS resolutions, which are the only ones that read them.
      # `require("jsthermalcomfort")` keeps working across the whole `engines`
      # range via Node's require(esm), not via a CommonJS build.
      - run: npm run check:exports
