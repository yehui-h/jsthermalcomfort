name: CI

on:
  push:
    branches: [main, typescript]
  pull_request:
    branches: [main, typescript]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run check:format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Proves the ESM/CJS/types wiring still resolves for every consumer
      # shape (node10, node16 CJS, node16 ESM, bundler). This is the guard
      # against silently re-breaking `require("jsthermalcomfort")`.
      - run: npm run check:exports
