<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JOS3 example</title>
    <meta
      name="description"
      content="Example of JOS3 Model usage in jsthermalcomfort"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script
      src="https://cdn.plot.ly/plotly-2.26.1.min.js"
      charset="utf-8"
    ></script>
  </head>
  <body style="text-align: center">
    <h1>JOS3 example</h1>
    <div>
      <h2>EXAMPLE 1 (simple simulation)</h2>
      <div id="graph1" style="width: 600px; height: 600px; margin: auto"></div>
      <h style="align-items: center"
        >The BMR value using the getter:
        <div id="example1 bmr"></div
      ></h>
      <h style="align-items: center"
        >The body name lists:
        <div id="example1 Body name list"></div
      ></h>
    </div>

    <div>
      <h2>EXAMPLE 2 (detail simulation)</h2>
      <div id="graph2" style="width: 600px; height: 600px; margin: auto"></div>
    </div>
  </body>
  <script type="module">
    // /+esm bundles the bare mathjs import so this page can run in a browser.
    import { JOS3 } from "https://cdn.jsdelivr.net/npm/jsthermalcomfort/lib/esm/models/JOS3.js/+esm";

    // Local clothing insulation [clo] for briefs, socks, undershirt, work
    // jacket, work pants, and safety shoes. jsthermalcomfort has no
    // local-ensemble table; clo and v accept an object keyed by body_names.
    const workwearLocalClo = {
      head: 0,
      neck: 0,
      chest: 1.25,
      back: 1.39,
      pelvis: 1.78,
      left_shoulder: 0.84,
      left_arm: 0.71,
      left_hand: 0.08,
      right_shoulder: 0.84,
      right_arm: 0.71,
      right_hand: 0.08,
      left_thigh: 0.65,
      left_leg: 0.59,
      left_foot: 1.12,
      right_thigh: 0.65,
      right_leg: 0.59,
      right_foot: 1.12,
    };

    const localAirSpeed = {
      head: 0.2,
      neck: 0.4,
      chest: 0.4,
      back: 0.1,
      pelvis: 0.1,
      left_shoulder: 0.4,
      left_arm: 0.4,
      left_hand: 0.4,
      right_shoulder: 0.4,
      right_arm: 0.4,
      right_hand: 0.4,
      left_thigh: 0.1,
      left_leg: 0.1,
      left_foot: 0.1,
      right_thigh: 0.1,
      right_leg: 0.1,
      right_foot: 0.1,
    };

    // cycle_time and per-segment skin temperature are columns of
    // dict_results(), not getters. With dtime = 60 s, cycle_time is minutes.
    function skinTemperatureTrace(results, key, name) {
      return {
        x: results.cycle_time,
        y: results[key],
        mode: "lines",
        name,
      };
    }

    let model = new JOS3(1.7, 60, undefined, 30);
    // Set the first phase
    model.to = 28; // Operative temperature [°C]
    model.rh = 40; // Relative humidity [%]
    model.v = 0.2; // Air velocity [m/s]
    model.par = 1.2; // Physical activity ratio [-]
    model.simulate(60); // Exposure time = 60 [min]

    // Set the next condition (You only need to change the parameters that you want to change)
    model.to = 20; // Change only operative temperature
    model.simulate(60); // Additional exposure time = 60 [min]

    let results = model.dict_results();
    let layout = {
      xaxis: {
        title: "Time [min]",
      },
      yaxis: {
        title: "Mean skin temperature [°C]",
      },
    };
    Plotly.newPlot(
      "graph1",
      [skinTemperatureTrace(results, "t_skin_mean", "Mean")],
      layout,
    );

    // Print the BMR value using the getter
    document.getElementById("example1 bmr").innerHTML = model.bmr;
    document.getElementById("example1 Body name list").innerHTML =
      model.body_names;

    // -------------------------------------------
    // EXAMPLE 2 (detail simulation)
    // -------------------------------------------

    // Build a model and set a body built
    // Create an instance of the JOS3 class with optional body parameters such as body height, weight, age, sex, etc.
    // Define a JOS3 object
    model = new JOS3(
      1.7,
      60,
      20,
      30,
      "male",
      undefined,
      "japanese",
      "fujimoto",
      "all",
    );

    // Set environmental conditions
    model.tdb = 28; // Air temperature [°C]
    model.tr = 30; // Mean radiant temperature [°C]
    model.rh = 40; // Relative humidity [%]
    model.v = localAirSpeed;
    model.clo = workwearLocalClo;

    model.par = 1.2; // Physical activity ratio [-]
    model.posture = "sitting"; // Posture

    // Run JOS-3 model
    model.simulate(
      30, // Number of loops of a simulation
      60, // Time delta [sec]
    ); // Exposure time = 30 [loops] * 60 [sec] = 30 [min]

    // Set the next condition
    model.to = 20; // Change operative temperature
    model.v = localAirSpeed;

    // Run JOS-3 model again
    model.simulate(
      60, // Number of loops of a simulation
      60, // Time delta [sec]
    ); // Additional exposure time = 60 [loops] * 60 [sec] = 60 [min]

    // Set the next condition
    model.tdb = 30; // Change air temperature [°C]
    model.tr = 35; // Change mean radiant temperature [°C]

    // Run JOS-3 model once more
    model.simulate(
      30, // Number of loops of a simulation
      60, // Time delta [sec]
    ); // Additional exposure time = 30 [loops] * 60 [sec] = 30 [min]

    // Show the results. Per-segment series are dict_results() columns
    // such as t_skin_head, not getters.
    results = model.dict_results();
    layout = {
      xaxis: {
        title: "Time [min]",
      },
      yaxis: {
        title: "Skin temperature [°C]",
      },
    };
    Plotly.newPlot(
      "graph2",
      [
        skinTemperatureTrace(results, "t_skin_mean", "Mean"),
        skinTemperatureTrace(results, "t_skin_head", "Head"),
        skinTemperatureTrace(results, "t_skin_chest", "Chest"),
        skinTemperatureTrace(results, "t_skin_left_hand", "Left hand"),
      ],
      layout,
    );
  </script>
</html>
